<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>存钱小本 · 本地版</title>
<meta name="description" content="本地优先的存单/保险记账本：数据只存在本机浏览器，支持导出备份。">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:oklch(95.5% 0.012 85);
  --surface:oklch(98.5% 0.006 85);
  --surface-2:oklch(95.5% 0.014 85);
  --ink:oklch(28% 0.02 60);
  --muted:oklch(48% 0.02 70);
  --line:oklch(87% 0.02 80);
  --accent:oklch(52% 0.11 40);
  --accent-soft:oklch(90% 0.04 45);
  --num:oklch(42% 0.1 225);
  --ok:oklch(52% 0.1 150);
  --ok-soft:oklch(93% 0.045 150);
  --warn:oklch(55% 0.12 65);
  --warn-soft:oklch(93% 0.05 75);
  --violet:oklch(48% 0.1 300);
  --violet-soft:oklch(92% 0.035 300);
  --danger:oklch(52% 0.18 25);
  --radius:14px;
  --shadow:0 1px 2px oklch(0% 0 0/.05),0 6px 18px oklch(0% 0 0/.06);
  --dur:160ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:oklch(20% 0.015 60);
    --surface:oklch(25% 0.015 60);
    --surface-2:oklch(29% 0.018 60);
    --ink:oklch(90% 0.01 85);
    --muted:oklch(66% 0.015 80);
    --line:oklch(35% 0.02 70);
    --accent:oklch(72% 0.1 45);
    --accent-soft:oklch(32% 0.05 45);
    --num:oklch(75% 0.09 225);
    --ok:oklch(72% 0.1 150);
    --ok-soft:oklch(30% 0.045 150);
    --warn:oklch(75% 0.11 75);
    --warn-soft:oklch(30% 0.05 75);
    --violet:oklch(72% 0.09 300);
    --violet-soft:oklch(30% 0.04 300);
    --danger:oklch(70% 0.15 25);
    --shadow:0 1px 2px oklch(0% 0 0/.4),0 6px 18px oklch(0% 0 0/.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit}
header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:oklch(from var(--bg) l c h/.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.logo{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:var(--accent);color:var(--surface);
  display:grid;place-items:center;font-size:14px;font-weight:700;
}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
h1 small{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
header .grow{flex:1}
main{max-width:560px;margin:0 auto;padding:14px 16px 0}
.summary{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 16px 12px;
}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum-grid .third{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px;margin-top:2px}
.sum label{display:block;font-size:12px;color:var(--muted)}
.sum .v{font-size:22px;font-weight:700;color:var(--num);font-variant-numeric:tabular-nums}
.sum .v.m{font-size:20px}
.sum .v small{font-size:12px;font-weight:400;color:var(--muted)}
.sum-foot{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.bank{margin-top:22px}
.bank h2{
  display:flex;align-items:baseline;gap:8px;margin:0 0 10px;
  font-size:14px;font-weight:700;padding-left:9px;border-left:3px solid var(--accent);
}
.bank h2 .bmeta{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;cursor:pointer;
  transition:transform var(--dur) ease;
}
.card:hover{transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .amt{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.crow .amt small{font-size:11px;font-weight:400;color:var(--muted)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;line-height:1.5;white-space:nowrap}
.t-deposit{background:var(--ok-soft);color:var(--ok)}
.t-insurance{background:var(--violet-soft);color:var(--violet)}
.t-other{background:var(--surface-2);color:var(--muted)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.s-dim{background:var(--surface-2);color:var(--muted)}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.cmeta b{color:var(--ink);font-weight:600}
.cnote{
  margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);word-break:break-all;
}
.empty{
  margin-top:24px;padding:32px 16px;text-align:center;color:var(--muted);
  border:1.5px dashed var(--line);border-radius:var(--radius);font-size:14px;
}
.fab{
  position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;
  width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);color:var(--surface);font-size:26px;line-height:1;
  box-shadow:0 4px 14px oklch(0% 0 0/.22);display:grid;place-items:center;
  transition:transform var(--dur) ease;
}
.fab:hover{transform:scale(1.05)}
.fab:active{transform:scale(.96)}
.btn{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;transition:filter var(--dur) ease;
}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 35%,var(--line))}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
dialog{
  border:none;border-radius:16px;padding:18px;width:min(92vw,420px);
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
}
dialog::backdrop{background:oklch(0% 0 0/.4)}
dialog h2{margin:0 0 4px;font-size:16px}
dialog label{display:block;margin:12px 0 0}
dialog label>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
dialog input,dialog select{
  width:100%;padding:10px 12px;font-size:16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
}
dialog input:focus,dialog select:focus{outline:2px solid var(--accent);outline-offset:1px}
dialog small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0;min-height:1.2em}
.row{display:flex;align-items:center;gap:8px;margin-top:18px}
.row .grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="logo" aria-hidden="true">存</span>
  <h1>存钱小本<small>本地版 · 数据不出手机</small></h1>
  <span class="grow"></span>
  <button id="btnData" class="btn btn-sm">数据</button>
</header>

<main>
  <section class="summary" aria-label="汇总">
    <div class="sum-grid">
      <div class="sum"><label>总本金（进行中）</label><div class="v"><span id="sPrincipal">0.00</span><small> 元</small></div></div>
      <div class="sum"><label>预期总收益</label><div class="v"><span id="sGain">0.00</span><small> 元</small></div></div>
      <div class="sum third"><label>预估当前月收益（进行中）</label><div class="v m">≈<span id="sMonthly">0.00</span><small> 元/月</small></div></div>
    </div>
    <p class="sum-foot" id="sFoot"></p>
  </section>

  <div id="groups"></div>

  <div id="empty" class="empty" hidden>
    还没有存单。<br>点右下角 ＋ 添加，或在「数据」里导入备份文件。
  </div>
</main>

<button id="fab" class="fab" aria-label="添加存单">＋</button>

<dialog id="formDlg" aria-labelledby="formTitle">
  <form id="f" novalidate>
    <h2 id="formTitle">添加存单</h2>
    <label><span>机构名称 *</span><input id="fBank" maxlength="50" placeholder="如：网商银行"></label>
    <label><span>类型</span>
      <select id="fType">
        <option value="deposit">定期存款</option>
        <option value="insurance">保险</option>
        <option value="other">其他</option>
      </select>
    </label>
    <label><span>金额（元）*</span><input id="fAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="如 20000"></label>
    <label><span>年利率（%）*</span><input id="fRate" type="number" min="0" max="100" step="0.001" inputmode="decimal" placeholder="如 1.80"></label>
    <label><span>开始日期 *</span><input id="fStart" type="date"></label>
    <label><span>到期日期 *</span><input id="fEnd" type="date"></label>
    <p class="hint" id="calcHint"></p>
    <label><span>预计利息（元）</span><input id="fInterest" type="number" min="0" step="0.01" inputmode="decimal" placeholder="留空＝自动计算">
      <small>自动口径：本金 × 年利率 × 实际天数 ÷ 365；银行有特殊计息规则时可手动修改</small>
    </label>
    <label><span>备注</span><input id="fNote" maxlength="100" placeholder="选填"></label>
    <div class="row">
      <button type="button" id="fDelete" class="btn danger" hidden>删除</button>
      <span class="grow"></span>
      <button type="button" id="fCancel" class="btn">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dataDlg" aria-labelledby="dataTitle">
  <h2 id="dataTitle">数据管理</h2>
  <p class="hint">数据仅保存在本机浏览器（localStorage），页面不联网上传任何内容。换手机、清浏览器数据前，先导出备份。</p>
  <div class="grid2">
    <button id="btnExportJson" class="btn">导出 JSON 备份</button>
    <button id="btnExportCsv" class="btn">导出 CSV</button>
    <button id="btnImport" class="btn">导入备份…</button>
    <button id="btnClear" class="btn danger">清空全部数据</button>
  </div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <div class="row"><span class="grow"></span><button id="dClose" class="btn btn-sm">关闭</button></div>
</dialog>

<script>
'use strict';
const KEY='cq-ledger.v1';
const $=s=>document.querySelector(s);
const TYPE_LABEL={deposit:'定期存款',insurance:'保险',other:'其他'};
const STATUS_META={active:['进行中','ok'],soon:['即将到期','warn'],matured:['已到期','dim']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=(s,e)=>Math.round((parseD(e)-parseD(s))/864e5);
const autoInt=it=>r2(Number(it.amount)*Number(it.rate)/100*days(it.start,it.end)/365);
const intOf=it=>(it.interest==null||it.interest==='')?autoInt(it):Number(it.interest);

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    return d&&Array.isArray(d.items)?d:null;
  }catch{return null}
}
let state=load()||{v:1,items:[]};
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch{alert('本地保存失败（隐私模式或存储被禁用）。请立即导出备份，并改用 https 托管方式访问。')}
}

function statusOf(it){
  const t=parseD(todayStr()),e=parseD(it.end);
  if(e<t)return 'matured';
  return (e-t)/864e5<=30?'soon':'active';
}

function render(){
  const items=[...state.items].sort((a,b)=>a.end===b.end?b.amount-a.amount:(a.end<b.end?-1:1));
  const act=items.filter(i=>statusOf(i)!=='matured');
  const mat=items.filter(i=>statusOf(i)==='matured');
  const principal=act.reduce((s,i)=>s+Number(i.amount),0);
  const gain=act.reduce((s,i)=>s+intOf(i),0);
  const monthly=act.reduce((s,i)=>s+Number(i.amount)*Number(i.rate)/100/12,0);
  const matInt=mat.reduce((s,i)=>s+intOf(i),0);
  $('#sPrincipal').textContent=fmt(principal);
  $('#sGain').textContent=fmt(gain);
  $('#sMonthly').textContent=fmt(monthly);
  $('#sFoot').textContent=`进行中 ${act.length} 笔 · 已到期 ${mat.length} 笔（到期利息合计 ${fmt(matInt)} 元）· 月收益口径：本金×年利率÷12`;

  const wrap=$('#groups');
  wrap.textContent='';
  if(!items.length){$('#empty').hidden=false;return}
  $('#empty').hidden=true;

  const byBank=new Map();
  for(const i of items){
    if(!byBank.has(i.bank))byBank.set(i.bank,[]);
    byBank.get(i.bank).push(i);
  }
  const banks=[...byBank.keys()].sort((a,b)=>{
    const ea=byBank.get(a)[0].end,eb=byBank.get(b)[0].end;
    return ea<eb?-1:ea>eb?1:a.localeCompare(b);
  });
  for(const b of banks){
    const list=byBank.get(b);
    const sum=list.reduce((s,i)=>s+Number(i.amount),0);
    const sec=document.createElement('section');
    sec.className='bank';
    sec.innerHTML=`<h2><span class="bname">${esc(b)}</span><span class="bmeta">${list.length} 笔 · 本金 ${fmt(sum)} 元</span></h2>`;
    for(const it of list){
      const st=statusOf(it),[sl,sc]=STATUS_META[st];
      const d=days(it.start,it.end);
      const term=d>=360?`≈${(d/365).toFixed(1)}年 / ${d}天`:`${d}天`;
      const inte=intOf(it);
      const card=document.createElement('article');
      card.className='card';card.tabIndex=0;card.dataset.id=it.id;
      card.innerHTML=`
        <div class="crow">
          <span class="chip t-${esc(it.type)}">${TYPE_LABEL[it.type]||esc(it.type)}</span>
          <span class="chip s-${sc}">${sl}</span>
          <span class="amt">${fmt(it.amount)}<small> 元</small></span>
        </div>
        <div class="cmeta">${esc(it.start)} → ${esc(it.end)} · ${term} · 年利率 ${esc(it.rate)}%</div>
        <div class="cmeta">预计利息 <b>${fmt(inte)}</b> 元 · 到期本息 <b>${fmt(Number(it.amount)+inte)}</b> 元</div>
        ${it.note?`<div class="cnote">${esc(it.note)}</div>`:''}`;
      sec.appendChild(card);
    }
    wrap.appendChild(sec);
  }
}

let editing=null;
function updateHint(){
  const a=Number($('#fAmount').value),r=Number($('#fRate').value);
  const s=$('#fStart').value,e=$('#fEnd').value;
  if(a>0&&r>=0&&s&&e&&parseD(e)>parseD(s)){
    const v=r2(a*r/100*days(s,e)/365);
    $('#calcHint').textContent=`存期 ${days(s,e)} 天 · 自动利息 ${fmt(v)} 元 · 到期本息 ${fmt(a+v)} 元`;
  }else{
    $('#calcHint').textContent='';
  }
}
function openForm(id){
  editing=id||null;
  const it=id?state.items.find(i=>i.id===id):null;
  $('#formTitle').textContent=it?'编辑存单':'添加存单';
  $('#fBank').value=it?it.bank:'';
  $('#fType').value=it?it.type:'deposit';
  $('#fAmount').value=it?it.amount:'';
  $('#fRate').value=it?it.rate:'';
  $('#fStart').value=it?it.start:todayStr();
  $('#fEnd').value=it?it.end:'';
  $('#fInterest').value=it&&it.interest!=null?it.interest:'';
  $('#fNote').value=it?(it.note||''):'';
  $('#fDelete').hidden=!it;
  updateHint();
  $('#formDlg').showModal();
}
['fAmount','fRate','fStart','fEnd'].forEach(id=>$('#'+id).addEventListener('input',updateHint));
$('#fCancel').onclick=()=>$('#formDlg').close();
$('#fDelete').onclick=()=>{
  if(!editing)return;
  if(!confirm('删除这条存单？'))return;
  state.items=state.items.filter(i=>i.id!==editing);
  persist();render();
  $('#formDlg').close();
};
$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const bank=$('#fBank').value.trim();
  const amount=Number($('#fAmount').value);
  const rate=Number($('#fRate').value);
  const start=$('#fStart').value,end=$('#fEnd').value;
  if(!bank){alert('请填写机构名称');return}
  if(!(amount>0)){alert('金额需大于 0');return}
  if(Number.isNaN(rate)||rate<0){alert('年利率不正确');return}
  if(!start||!end){alert('请选择开始与到期日期');return}
  if(parseD(end)<=parseD(start)){alert('到期日期需晚于开始日期');return}
  const raw=$('#fInterest').value.trim();
  const auto=autoInt({amount,rate,start,end});
  const interest=raw===''?null:(Math.abs(Number(raw)-auto)<0.005?null:Number(raw));
  if(editing){
    const it=state.items.find(i=>i.id===editing);
    Object.assign(it,{bank,type:$('#fType').value,amount,rate,start,end,interest,note:$('#fNote').value.trim()});
  }else{
    state.items.push({
      id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,8)),
      type:$('#fType').value,bank,amount,rate,start,end,interest,
      note:$('#fNote').value.trim(),created:todayStr()
    });
  }
  persist();render();
  $('#formDlg').close();
});

function download(name,mime,text){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function csvCell(v){
  v=String(v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
$('#btnExportJson').onclick=()=>{
  download(`存钱小本备份-${todayStr()}.json`,'application/json',JSON.stringify(state,null,2));
};
$('#btnExportCsv').onclick=()=>{
  const head='机构,类型,金额,年利率%,开始,到期,天数,预计利息,到期本息,状态,备注';
  const rows=state.items.map(i=>{
    const inte=intOf(i);
    return [
      i.bank,TYPE_LABEL[i.type]||i.type,i.amount,i.rate,i.start,i.end,
      days(i.start,i.end),inte,r2(Number(i.amount)+inte),
      STATUS_META[statusOf(i)][0],i.note||''
    ].map(csvCell).join(',');
  });
  download(`存钱小本-${todayStr()}.csv`,'text/csv;charset=utf-8','﻿'+head+'\n'+rows.join('\n'));
};
$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    const items=d&&Array.isArray(d.items)?d.items:(Array.isArray(d)?d:null);
    if(!items)throw new Error('文件结构不对，需要 {"items":[…]}');
    items.forEach((it,k)=>{
      if(!it||!it.bank||!(Number(it.amount)>0)||!it.start||!it.end){
        throw new Error(`第 ${k+1} 条缺少必填字段（bank/amount/start/end）`);
      }
    });
    const map=new Map(state.items.map(i=>[i.id,i]));
    for(const it of items){
      const id=it.id||('imp-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
      map.set(id,{...it,id});
    }
    state={v:1,items:[...map.values()]};
    persist();render();
    $('#dataDlg').close();
    alert(`已导入 ${items.length} 条（相同 id 的旧数据被覆盖）`);
  }catch(err){
    alert('导入失败：'+err.message);
  }finally{
    e.target.value='';
  }
});
$('#btnClear').onclick=()=>{
  if(confirm(`确定清空全部 ${state.items.length} 条数据？不可撤销，建议先导出备份。`)){
    state={v:1,items:[]};
    persist();render();
    $('#dataDlg').close();
  }
};
$('#btnData').onclick=()=>$('#dataDlg').showModal();
$('#dClose').onclick=()=>$('#dataDlg').close();
$('#fab').onclick=()=>openForm();
$('#groups').addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(c)openForm(c.dataset.id);
});
$('#groups').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const c=e.target.closest('.card');
    if(c)openForm(c.dataset.id);
  }
});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
